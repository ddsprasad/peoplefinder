<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>peopleFinder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-bottom: 4rem; }
    .log-box { background:#0d1117; color:#c9d1d9; font-family:monospace;
               font-size:.8rem; height:320px; overflow:auto; padding:.75rem;
               border-radius:.5rem; white-space:pre-wrap; }
    .table-sm td, .table-sm th { font-size:.85rem; }
    code.md5 { font-size:.8rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">🔎 peopleFinder</span>
    <div class="navbar-nav">
      <a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">1. Index</a>
      <a class="nav-link {% if request.path=='/master' %}active{% endif %}" href="/master">2. Master data</a>
      <a class="nav-link {% if request.path=='/output' %}active{% endif %}" href="/output">3. Output</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
